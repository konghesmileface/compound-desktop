name: Build Mac Intel 轻量版

# 轻量版(rapidocr):PyInstaller 打后端 sidecar + Tauri 打 .app/.dmg。
# ★必须 macos-13(Intel 原生):Python sidecar 不能交叉编译。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sidecar/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - '.github/workflows/build-mac-intel.yml'

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: 下 bge-m3 嵌入模型(2.3G,打进包→离线开箱即用)
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip huggingface_hub
          HF_ENDPOINT=https://hf-mirror.com python -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-m3', local_dir='models/bge-m3', ignore_patterns=['onnx/*','*.onnx','colbert*','*.msgpack','*.h5','imgs/*'])"
          du -sh models/bge-m3

      - name: 打后端 sidecar(PyInstaller,内含 rapidocr v6 + bge-m3)
        working-directory: sidecar
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm compound-sidecar.spec
          echo "=== 冻结包自检:重依赖 import ==="
          ./dist/compound-sidecar/compound-sidecar --selftest
          echo "=== /health 自检 ==="
          ./dist/compound-sidecar/compound-sidecar --host 127.0.0.1 --port 8299 & sleep 20
          curl -sf http://127.0.0.1:8299/health && echo " OK" || (echo "FAIL: sidecar 起不来"; exit 1)

      - name: Tauri 打 .app/.dmg(内嵌 sidecar)
        run: |
          npm install
          npm run tauri build -- --target x86_64-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: compound-mac-intel-lite
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
