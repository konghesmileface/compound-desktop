name: Build Mac Intel 高精版

# 高精版(rapidocr v6 + paddle PP-StructureV3 + bge-m3)。
# 主 sidecar(torch)+ paddle worker(独立 paddle 环境,进程隔离)都用 Rosetta 出 x86_64;
# Tauri 用 tauri.hd.conf.json 内嵌两个二进制,交叉编译 x86_64。macos-latest 不排队。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: 装 x86_64 Python(经 Rosetta)
        run: |
          curl -fsSL -o /tmp/python.pkg https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "PY=/Library/Frameworks/Python.framework/Versions/3.10/bin/python3" >> "$GITHUB_ENV"

      - name: 下 bge-m3(打进包)
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m pip install --upgrade pip huggingface_hub
          HF_ENDPOINT=https://hf-mirror.com arch -x86_64 "$PY" -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-m3', local_dir='models/bge-m3', ignore_patterns=['onnx/*','*.onnx','colbert*','*.msgpack','*.h5','imgs/*'])"

      - name: 冻结主 sidecar(x86_64,torch 环境)+ selftest
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m venv .venv-base
          arch -x86_64 .venv-base/bin/python -m pip install --upgrade pip
          arch -x86_64 .venv-base/bin/python -m pip install -r requirements.txt pyinstaller
          arch -x86_64 .venv-base/bin/python -m PyInstaller --noconfirm compound-sidecar.spec
          file dist/compound-sidecar/compound-sidecar
          ./dist/compound-sidecar/compound-sidecar --selftest

      - name: 冻结 paddle worker(x86_64,独立 paddle 环境)
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m venv .venv-paddle
          arch -x86_64 .venv-paddle/bin/python -m pip install --upgrade pip
          arch -x86_64 .venv-paddle/bin/python -m pip install "paddlepaddle==3.0.0" "paddleocr" "paddlex[ocr]" fastapi uvicorn python-multipart Pillow pyinstaller
          arch -x86_64 .venv-paddle/bin/python -m PyInstaller --noconfirm compound-paddle.spec
          file dist/compound-paddle/compound-paddle
          test -x dist/compound-paddle/compound-paddle && echo "✓ paddle worker x86_64 冻结成功"

      - name: Tauri 打高精版 .app/.dmg(内嵌主+paddle 两 x86_64 二进制)
        run: |
          npm install
          npm run tauri build -- --config src-tauri/tauri.hd.conf.json --target x86_64-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: compound-mac-intel-hd
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
