name: Build Mac Intel 高精版

# 高精版(rapidocr v6 + paddle PP-StructureV3 + bge-m3)。
# 主 sidecar(torch)+ paddle worker(独立 paddle 环境,进程隔离)都用 Rosetta 出 x86_64;
# Tauri 用 tauri.hd.conf.json 内嵌两个二进制,交叉编译 x86_64。macos-latest 不排队。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: 装 x86_64 Python(经 Rosetta)
        run: |
          curl -fsSL -o /tmp/python.pkg https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /
          echo "PY=/Library/Frameworks/Python.framework/Versions/3.10/bin/python3" >> "$GITHUB_ENV"

      - name: 下 bge-m3(打进包)
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m pip install --upgrade pip huggingface_hub
          arch -x86_64 "$PY" -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-m3', local_dir='models/bge-m3', ignore_patterns=['onnx/*','*.onnx','colbert*','*.msgpack','*.h5','imgs/*'])"

      - name: 下音视频入库模型 + Mac ffmpeg(SenseVoice ASR/说话人分离,打进包→离线可用)
        working-directory: sidecar
        run: |
          set -e
          mkdir -p models bin
          curl -fsSL -o /tmp/sv.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xjf /tmp/sv.tar.bz2 -C models/
          curl -fsSL -o models/silero_vad.onnx https://github.com/snakers4/silero-vad/raw/v4.0/files/silero_vad.onnx  # ★v4:sherpa1.11.1兼容
          curl -fsSL -o /tmp/seg.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          tar xjf /tmp/seg.tar.bz2 -C models/
          curl -fsSL -o models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          curl -fsSL -o /tmp/ff.zip https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
          unzip -o /tmp/ff.zip -d bin/ && chmod +x bin/ffmpeg
          du -sh models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17 bin/ffmpeg

      - name: 冻结主 sidecar(x86_64,torch 环境)+ selftest
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m venv .venv-base
          arch -x86_64 .venv-base/bin/python -m pip install --upgrade pip
          arch -x86_64 .venv-base/bin/python -m pip install -r requirements.txt pyinstaller
          arch -x86_64 .venv-base/bin/python -m PyInstaller --noconfirm compound-sidecar.spec
          file dist/compound-sidecar/compound-sidecar
          ./dist/compound-sidecar/compound-sidecar --selftest

      - name: 冻结 paddle worker(x86_64,独立 paddle 环境)
        working-directory: sidecar
        run: |
          arch -x86_64 "$PY" -m venv .venv-paddle
          arch -x86_64 .venv-paddle/bin/python -m pip install --upgrade pip
          # ★numpy 和 scipy 都必须锁到走 OpenBLAS 的版本(与主 sidecar 一致):numpy 2.x / scipy 1.12+
          #   在 macOS 上改链 Apple Accelerate 的 NEWLAPACK/ILP64 符号(cblas_*$NEWLAPACK$ILP64),这些符号
          #   macOS 13.3+ 才有;macOS 12(Monterey)上 dlopen numpy._core._multiarray_umath / scipy.linalg._fblas
          #   直接 Symbol not found→paddle worker 起不来、高精 OCR 全废(实测 mac2 macOS 12.7.6 逐层定位)。
          #   numpy 1.26.4 + scipy 1.11.4 都自带 OpenBLAS、不依赖 Accelerate,向下兼容 macOS 12。
          arch -x86_64 .venv-paddle/bin/python -m pip install "numpy==1.26.4" "scipy==1.11.4" "paddlepaddle==3.0.0" "paddleocr" "paddlex[ocr]" fastapi uvicorn python-multipart Pillow pyinstaller
          # 兜底:若被 paddle 传递依赖升级,强制拉回(--no-deps 不级联)
          arch -x86_64 .venv-paddle/bin/python -m pip install --force-reinstall --no-deps "numpy==1.26.4" "scipy==1.11.4"
          arch -x86_64 .venv-paddle/bin/python -c "import numpy, scipy; print('paddle env numpy =', numpy.__version__, 'scipy =', scipy.__version__)"
          # ★paddlex[ocr] 新版拉进 modelscope→cryptography,arm64 runner 上常装成 arm64 wheel→
          #   x86_64 加载报 "incompatible architecture (have 'arm64', need 'x86_64')" 构建崩。
          #   强制以 x86_64 无缓存、只用 wheel 重装 cryptography(有官方 x86_64 macos wheel)。
          arch -x86_64 .venv-paddle/bin/python -m pip install --force-reinstall --no-cache-dir --only-binary :all: cryptography
          # 下 PP-StructureV3 全套模型到 paddle_models/(区域无关离线);spec 会打进包
          PADDLE_PDX_CACHE_HOME="$PWD/paddle_models" arch -x86_64 .venv-paddle/bin/python -c "from paddleocr import PPStructureV3; PPStructureV3(use_doc_orientation_classify=False, use_doc_unwarping=False, use_chart_recognition=False); print('paddle models ready')"
          du -sh paddle_models
          arch -x86_64 .venv-paddle/bin/python -m PyInstaller --noconfirm compound-paddle.spec
          file dist/compound-paddle/compound-paddle
          test -x dist/compound-paddle/compound-paddle && echo "✓ paddle worker x86_64 冻结成功"

      - name: Tauri 打高精版 .app/.dmg(内嵌主+paddle 两 x86_64 二进制)
        env:
          VITE_TAURI: '1'   # ★桌面包:vite base 相对路径(改 env 跨平台,原内联已从 beforeBuildCommand 移除)
        run: |
          npm install
          npm run tauri build -- --config src-tauri/tauri.hd.conf.json --target x86_64-apple-darwin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: compound-mac-intel-hd
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn
