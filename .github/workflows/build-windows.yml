name: Build Windows 轻量版

# Windows x64 轻量版(rapidocr v6 + bge-m3 打进包)。原生 windows-latest 构建。
# ★第一版(2026-08-29):照 Mac Intel workflow 改;Windows 特有坑(sherpa/onnxruntime wheel、
#   ffmpeg.exe、officecli.exe、tar bzip2、nsis 打包)预期要几轮 CI 磨。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sidecar/**'
      - 'src-tauri/**'
      - 'frontend/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      # ★Windows 不打包 bge-m3(2.3G):NSIS makensis 无法装 >2G 单文件(pytorch_model.bin)→ makensis mmap 失败。
      #   Windows 首次语义检索时从 HF 下载(sidecar EMBED_MODEL 回落 BAAI/bge-m3);selftest 已对 Windows 宽容。
      - name: 准备 pip(Windows 瘦身:不打 bge-m3)
        shell: bash
        run: python -m pip install --upgrade pip

      - name: 下音视频模型 + Windows ffmpeg.exe
        working-directory: sidecar
        shell: bash
        run: |
          set -e
          mkdir -p models bin
          curl -fsSL -o /tmp/sv.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xjf /tmp/sv.tar.bz2 -C models/
          curl -fsSL -o models/silero_vad.onnx https://github.com/snakers4/silero-vad/raw/v4.0/files/silero_vad.onnx
          curl -fsSL -o /tmp/seg.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          tar xjf /tmp/seg.tar.bz2 -C models/
          curl -fsSL -o models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          # Windows 静态 ffmpeg(BtbN 官方 release,essentials 版含 ffmpeg.exe)
          curl -fsSL -o /tmp/ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -o -q /tmp/ff.zip -d /tmp/ffdir
          cp "$(find /tmp/ffdir -name ffmpeg.exe | head -1)" bin/ffmpeg.exe
          ls -la bin/ models/

      - name: 冻结后端 sidecar(Windows x64)+ selftest
        working-directory: sidecar
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm compound-sidecar.spec
          ./dist/compound-sidecar/compound-sidecar.exe --selftest

      # ★用 MSI(WiX)不用 NSIS:NSIS 32位 makensis 有 ~2GB 总包硬限(总模型>2G→mmap out of range 崩)。
      #   Mac DMG 无此限所以能全打包;换 MSI 保持和 Mac 一致「全打包离线」,不破坏一致性去瘦身(用户令)。
      - name: Tauri 打 Windows 安装包(MSI/WiX,内嵌 sidecar)
        env:
          VITE_TAURI: '1'   # ★桌面包:vite base 相对路径(不能内联在 beforeBuildCommand,Windows cmd 不认)
        run: |
          npm install
          npm run tauri build -- --bundles msi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: compound-windows-lite
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
